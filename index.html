<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#132a3a"><title>Torn A · Bombers Tortosa</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#1c2c36;background:#f1f5f7}*{box-sizing:border-box}body{margin:0}header{background:#142d3e;color:white;padding:18px 18px 12px;position:sticky;top:0;z-index:2}header h1{font-size:21px;margin:0}header small{color:#bcd0dc}nav{display:flex;overflow:auto;gap:7px;padding:12px 0 3px}nav button{white-space:nowrap;background:#294557;color:white;border:0;border-radius:18px;padding:9px 13px}nav button.active{background:#f47e51;color:#182e3d;font-weight:700}main{max-width:1000px;margin:auto;padding:18px 14px 55px}.panel{background:white;border:1px solid #dfe7eb;border-radius:15px;padding:17px;margin-bottom:15px;box-shadow:0 2px 9px #17334708}.panel h2{margin:0 0 13px;font-size:20px}.panel h3{font-size:16px;margin:15px 0 9px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}.metric{background:#edf3f6;border-radius:12px;padding:15px}.metric b{font-size:25px;display:block;margin-top:5px}.muted{color:#657b89;font-size:13px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}label{font-size:13px;color:#506472;display:block;margin:10px 0 4px}input,select,textarea{width:100%;border:1px solid #cbd7df;border-radius:9px;padding:10px;font:inherit;background:#fff;min-width:0}input[type=checkbox]{width:auto}button{cursor:pointer;border:0;border-radius:9px;padding:10px 13px;background:#17607a;color:#fff;font:inherit}button.secondary{background:#e9eff2;color:#244255}button.danger{background:#a93936}button:disabled{opacity:.5;cursor:default}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:9px}.fields>*{min-width:0}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:9px 7px;text-align:left;border-bottom:1px solid #e4ebef}th{color:#526a78;font-weight:600}table{display:block;overflow-x:auto}.tag{border-radius:15px;padding:4px 8px;background:#e7f0f3;font-size:12px;white-space:nowrap}.notice{border-left:4px solid #e4a043;background:#fff8eb;padding:11px;border-radius:6px;margin-bottom:13px}.success{color:#167454}.error{color:#b13b32}.mini{font-size:12px;padding:6px 9px}.checkrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #edf1f3}.checkrow input{flex:0}.checkrow span{flex:1}@media(min-width:700px){header>div{max-width:1000px;margin:auto}}@media(max-width:480px){.panel{padding:13px}.fields{grid-template-columns:1fr 1fr}h2{font-size:18px}}
</style></head><body><header><div><h1>🚒 Torn A · Tortosa</h1><small>Gestió del torn · Netlify + PostgreSQL</small><nav id="nav"></nav></div></header><main id="app"></main><script>
const PEOPLE=['Llore','Abraham','Diego','Gerard','Andreu','Simó','Òscar','David','Andrea'];const ROLES=['Comandament','Bomber 1','Bomber 2','Bomber 3','Bomber 4','Conductor 1','Conductor 2'];const ORDER=['Gerard','Abraham','David','Diego','Simó','Andreu','Òscar','Andrea','Llore'];const SECTIONS=[['inici','Inici'],['rols','Rols'],['especials','Serveis especials'],['hores','Hores extres'],['caixa','Caixa'],['comunitat','Comunitat'],['compres','Compres'],['apats','Àpats i sortides'],['tasques','Tasques'],['vacances','Vacances'],['permisos','Permisos'],['dades','Dades']];const initial=()=>({roles:[],special:[],overtime:[],cash:[],cashInitial:0,community:[],communityPayments:[],shopping:[],events:[],attendance:[],tasks:[],vacations:[{year:2026,round:1,person:'Gerard',period:'1a setembre'},{year:2026,round:1,person:'Abraham',period:'2a juliol'},{year:2026,round:1,person:'David',period:'2a desembre'},{year:2026,round:1,person:'Diego',period:'1a juny'},{year:2026,round:1,person:'Simó',period:'2a setembre'},{year:2026,round:1,person:'Andreu',period:'1a desembre'},{year:2026,round:1,person:'Òscar',period:'2a octubre'},{year:2026,round:1,person:'Andrea',period:'2a març'},{year:2026,round:1,person:'Llore',period:'1a agost'},{year:2026,round:2,person:'Llore',period:'1a febrer'}],permissions:[]});let state=initial(), revision=0, writeQueue=Promise.resolve(), busy=false;let section='inici',viewPerson='Diego',year=2027;const $=s=>document.querySelector(s),escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const eur=n=>(Number(n)||0).toLocaleString('ca-ES',{style:'currency',currency:'EUR'}),num=n=>(Number(n)||0).toLocaleString('ca-ES'),today=()=>new Date().toLocaleDateString('en-CA'),uid=()=>String(Date.now())+Math.random().toString(36).slice(2,7);const opts=(arr,selected)=>arr.map(x=>`<option value="${escapeHtml(x)}" ${x===selected?'selected':''}>${escapeHtml(x)}</option>`).join('');const personSelect=(id,selected='Diego')=>`<select id="${id}">${opts(PEOPLE,selected)}</select>`;const roleSelect=(id)=>`<select id="${id}">${opts(ROLES)}</select>`;const form=(id,fields,button='Guardar')=>`<form id="${id}" class="panel"><div class="fields">${fields}</div><p><button type="submit">${button}</button></p></form>`;const field=(name,html)=>`<div><label>${name}</label>${html}</div>`;const input=(id,type='text',value='',extra='')=>`<input id="${id}" type="${type}" value="${escapeHtml(value)}" ${extra} required>`;const select=(id,values)=>`<select id="${id}">${opts(values)}</select>`;const panel=(title,content)=>`<section class="panel"><h2>${title}</h2>${content}</section>`;const table=(headers,rows)=>`<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${headers.length}" class="muted">Encara no hi ha registres</td></tr>`}</tbody></table>`;const tr=cols=>`<tr>${cols.map(x=>`<td>${x}</td>`).join('')}</tr>`;const del=(key,id)=>`<button class="danger mini" data-delete="${key}" data-id="${id}" title="Eliminar">×</button>`;const balance=()=>Number(state.cashInitial)+state.cash.reduce((a,x)=>a+(x.kind==='ingres'?1:-1)*Number(x.amount),0);const read=id=>$('#'+id).value;const cashMove=(kind,amount,concept,channel='efectiu')=>state.cash.push({id:uid(),date:today(),kind,amount,concept,channel});function save(){
  const snapshot=structuredClone(state);
  const baseRevision=revision;
  writeQueue=writeQueue.then(async()=>{
    const response=await fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json','X-Requested-With':'TornA'},body:JSON.stringify({revision,data:snapshot})});
    if(response.status===409){alert('Un altre dispositiu ha modificat les dades. Es carregaran els canvis del servidor. Revisa i torna a introduir el darrer canvi.');await loadState();return;}
    if(response.status===401){location.reload();return;}
    if(!response.ok)throw Error('HTTP '+response.status);
    const result=await response.json();revision=result.revision;
  }).catch(err=>{alert('No s’han pogut desar els canvis al servidor: '+err.message+'. Recarrega abans de continuar.');});
  render();
}function add(key,data){state[key].push({id:uid(),...data});save()}function render(){ $('#nav').innerHTML=SECTIONS.map(([id,name])=>`<button data-section="${id}" class="${section===id?'active':''}">${name}</button>`).join('');$('#app').innerHTML=({inici:home,rols:roles,especials:special,hores:overtime,caixa:cash,comunitat:community,compres:shopping,apats:meals,tasques:tasks,vacances:vacations,permisos:permissions,dades:dataPage}[section])();bind()}
function home(){let latest=new Date('2026-10-15T12:00:00'),now=new Date();while(latest<now)latest.setDate(latest.getDate()+4);return `<div class="notice"><b>Versió compartida:</b> les dades es desen a la base de dades PostgreSQL. Tots els dispositius connectats al mateix servidor veuen les mateixes dades. L'accés és amb una contrasenya compartida; encara no hi ha permisos individuals.</div><div class="grid"><div class="metric">Proper torn calculat<b>${latest.toLocaleDateString('ca-ES')}</b><span class="muted">24 h cada 4 dies, base 15/10/2026</span></div><div class="metric">Caixa en metàl·lic<b>${eur(balance())}</b></div><div class="metric">Membres del torn<b>9</b></div><div class="metric">Tasques pendents<b>${state.tasks.filter(x=>x.status!=='Feta').length}</b></div></div>${panel('Equip del Torn A',PEOPLE.map(p=>`<span class="tag" style="display:inline-block;margin:4px">${p}</span>`).join(''))}${panel('Mòduls preparats','Utilitza les pestanyes superiors per registrar serveis, hores, moviments, vacances i activitats. Les dades de vacances 2026 ja estan introduïdes. Les altres seccions comencen buides per no inventar dades.')}`}
function roles(){let counts=ROLES.map(r=>({role:r,n:state.roles.filter(x=>x.person===viewPerson&&x.role===r).length}));let assigned=state.roles.filter(x=>x.date===today());return panel('Assignació de rols',`<p class="muted">Registra un rol per bomber i guàrdia. Si canvia, elimina el registre anterior i afegeix el correcte.</p>`)+form('roleForm',field('Data',input('rDate','date',today()))+field('Bomber',personSelect('rPerson'))+field('Rol',roleSelect('rRole')))+panel('Recompte individual',field('Bomber',personSelect('roleView',viewPerson))+`<div class="grid"><div class="metric">Bomber<b>${counts.filter(x=>x.role.startsWith('Bomber')).reduce((s,x)=>s+x.n,0)}</b></div><div class="metric">Conductor<b>${counts.filter(x=>x.role.startsWith('Conductor')).reduce((s,x)=>s+x.n,0)}</b></div><div class="metric">Comandament<b>${counts[0].n}</b></div></div>`+table(['Rol','Vegades'],counts.map(x=>tr([x.role,num(x.n)]))))+panel('Historial de rols',table(['Data','Bomber','Rol',''],[...state.roles].reverse().map(x=>tr([x.date,x.person,x.role,del('roles',x.id)]))))}
function special(){return panel('Desplaçaments forçosos i Golf Eco 00','<p class="muted">Recompte per registre. Pots indicar el parc de destinació si és un desplaçament.</p>')+form('specialForm',field('Data',input('sDate','date',today()))+field('Bomber',personSelect('sPerson'))+field('Tipus',select('sType',['Desplaçament forçós','Golf Eco 00']))+field('Parc de destinació / observació','<input id="sPlace" placeholder="Opcional">'))+panel('Recompte per bomber',table(['Bomber','Desplaçaments','Golf Eco 00'],PEOPLE.map(p=>tr([p,state.special.filter(x=>x.person===p&&x.type==='Desplaçament forçós').length,state.special.filter(x=>x.person===p&&x.type==='Golf Eco 00').length]))))+panel('Historial',table(['Data','Bomber','Tipus','Detall',''],[...state.special].reverse().map(x=>tr([x.date,x.person,x.type,escapeHtml(x.place),del('special',x.id)]))))}
function overtime(){return panel('Hores extraordinàries','<p class="muted">Introdueix hores decimals si cal (per exemple, 6,5). El tipus de dia es registra manualment.</p>')+form('hoursForm',field('Data',input('hDate','date',today()))+field('Bomber',personSelect('hPerson'))+field('Hores',input('hHours','number',24,'min="0.25" max="24" step="0.25"'))+field('Modalitat',select('hMode',['M0','M1','M2','ME']))+field('Tipus de dia',select('hDay',['Entre setmana','Cap de setmana','Festiu'])))+panel('Recompte per bomber',table(['Bomber','Total h','M0','M1','M2','ME'],PEOPLE.map(p=>tr([p,...['total','M0','M1','M2','ME'].map(m=>num(state.overtime.filter(x=>x.person===p&&(m==='total'||x.mode===m)).reduce((s,x)=>s+Number(x.hours),0)))]))))+panel('Historial',table(['Data','Bomber','Hores','Modalitat','Dia',''],[...state.overtime].reverse().map(x=>tr([x.date,x.person,num(x.hours),x.mode,x.day,del('overtime',x.id)]))))}
function cash(){return panel('Caixa en metàl·lic',`<div class="metric">Saldo actual<b>${eur(balance())}</b></div><p class="muted">Les quotes per Bizum no augmenten aquest saldo. Registra aquí només diners físics del pot.</p>`)+form('initialForm',field('Saldo inicial de caixa (€)',input('cInitial','number',state.cashInitial,'step="0.01"')),'Actualitzar saldo inicial')+form('cashForm',field('Data',input('cDate','date',today()))+field('Tipus',select('cKind',['despesa','ingres']))+field('Import (€)',input('cAmount','number','','min="0.01" step="0.01"'))+field('Concepte',input('cConcept')),'Registrar moviment')+panel('Moviments de caixa',table(['Data','Concepte','Tipus','Import',''],[...state.cash].reverse().map(x=>tr([x.date,escapeHtml(x.concept),x.kind,eur(x.amount),del('cash',x.id)]))))}
function community(){const fees=state.community;return panel('Quotes i derrames',`<p>Quota orientativa: <b>50 € per bomber i semestre</b>, modificable segons la situació de la caixa. Els Bizums els rep Llore i ell fa el pagament a la comunitat.</p><p class="muted">Aquesta versió no comprova identitats. Els permisos d'administració s'aplicaran quan hi hagi accés compartit.</p>`)+form('feeForm',field('Concepte / període',input('fTitle','text','2n semestre 2026'))+field('Tipus',select('fType',['Semestral','Derrama extraordinària']))+field('Quota per bomber (€)',input('fAmount','number',50,'min="0" step="0.01"')),'Crear quota')+fees.map(f=>{const paid=state.communityPayments.filter(p=>p.feeId===f.id&&p.kind==='cobrament');const sent=state.communityPayments.filter(p=>p.feeId===f.id&&p.kind==='pagament').reduce((s,p)=>s+Number(p.amount),0);return panel(`${escapeHtml(f.title)} · ${escapeHtml(f.type)}`,`<div class="grid"><div class="metric">Cobrat per Bizum<b>${eur(paid.reduce((s,p)=>s+Number(p.amount),0))}</b></div><div class="metric">Pagat a comunitat<b>${eur(sent)}</b></div><div class="metric">Pendent de cobrar<b>${9-paid.length} persones</b></div></div><h3>Pagaments individuals</h3>${PEOPLE.map(p=>{let item=paid.find(x=>x.person===p);return `<div class="checkrow"><span>${p}</span><span class="muted">${item?'Pagat · '+eur(item.amount):'Pendent'}</span>${item?`<button class="mini danger" data-delete="communityPayments" data-id="${item.id}">Desfer</button>`:`<button class="mini" data-pay="${f.id}" data-person="${p}">Marcar Bizum ${eur(f.amount)}</button>`}</div>`}).join('')}<h3>Pagament de Llore a la comunitat</h3><div class="fields">${field('Import (€)',`<input id="send-${f.id}" type="number" min="0.01" step="0.01" value="${f.amount*9}">`)}${field('Data',`<input id="senddate-${f.id}" type="date" value="${today()}">`)}</div><p><button data-send="${f.id}">Registrar pagament</button> <button class="secondary mini" data-delete="community" data-id="${f.id}">Eliminar quota</button></p>${table(['Data','Moviment','Import',''],state.communityPayments.filter(p=>p.feeId===f.id).map(p=>tr([p.date,p.kind==='cobrament'?'Bizum de '+p.person:'Pagament a comunitat',eur(p.amount),del('communityPayments',p.id)])))}`)}).join('')}
function shopping(){return panel('Compres pendents',`<p class="muted">Llista per a productes habituals (oli, mel...) o material extraordinari.</p>`)+form('shopForm',field('Producte o material',input('shName'))+field('Detall / quantitat','<input id="shNote">'))+panel('Llista de compres',state.shopping.map(x=>`<div class="checkrow"><input type="checkbox" data-toggle="shopping" data-id="${x.id}" ${x.done?'checked':''}><span>${escapeHtml(x.name)} <small class="muted">${escapeHtml(x.note)}</small></span>${del('shopping',x.id)}</div>`).join('')||'<p class="muted">Cap compra pendent</p>')}
function meals(){return panel('Àpats i sortides','<p class="muted">Crea un dinar, sopar o sortida i registra les persones apuntades.</p>')+form('eventForm',field('Nom de l’activitat',input('eTitle'))+field('Data',input('eDate','date',today()))+field('Lloc','<input id="ePlace">')+field('Cost previst (€)','<input id="eCost" type="number" min="0" step="0.01">'))+state.events.map(e=>panel(escapeHtml(e.title),`<p class="muted">${e.date} · ${escapeHtml(e.place)} · ${eur(e.cost)} previstos</p><p><b>${state.attendance.filter(a=>a.eventId===e.id).length} apuntats</b></p>${PEOPLE.map(p=>{let a=state.attendance.find(a=>a.eventId===e.id&&a.person===p);return `<div class="checkrow"><input type="checkbox" data-attend="${e.id}" data-person="${p}" ${a?'checked':''}><span>${p}</span></div>`}).join('')}<p>${del('events',e.id)}</p>`)).join('')}
function tasks(){return panel('Tasques extraordinàries',`<p class="muted">Feines fora de la rutina habitual de guàrdia.</p>`)+form('taskForm',field('Tasca',input('tTitle'))+field('Responsable',`<select id="tPerson"><option value="">Sense assignar</option>${opts(PEOPLE)}</select>`)+field('Data límit','<input id="tDate" type="date">')+field('Prioritat',select('tPriority',['Normal','Alta','Baixa'])))+panel('Tasques',state.tasks.map(t=>`<div class="checkrow"><span><b>${escapeHtml(t.title)}</b><br><small class="muted">${escapeHtml(t.person||'Sense responsable')} · ${t.date||'Sense data'} · ${t.priority}</small></span><select data-taskstatus="${t.id}" style="width:110px">${opts(['Pendent','En curs','Feta'],t.status)}</select>${del('tasks',t.id)}</div>`).join('')||'<p class="muted">Sense tasques registrades</p>')}
function vacations(){const shift=((year-2026)%9+9)%9,first=ORDER.map((_,i)=>ORDER[(i+shift)%9]),second=[...first].reverse();let selected=state.vacations.filter(v=>v.year===year);return panel('Ordre anual d’elecció',`<p class="muted">Rotació circular: el primer passa a l'últim; el segon passa al primer. Segona ronda en ordre invers.</p>${field('Any',`<select id="vacYear">${opts(Array.from({length:21},(_,i)=>String(2026+i)),String(year))}</select>`)}<div class="grid"><div>${table(['1a elecció','Bomber'],first.map((p,i)=>tr([i+1,p])))}</div><div>${table(['2a elecció','Bomber'],second.map((p,i)=>tr([i+1,p])))}</div></div>`)+panel('Quinzenes escollides',table(['Ronda','Bomber','Quinzena',''],selected.map(v=>tr([v.round,v.person,escapeHtml(v.period),del('vacations',v.id)]))))+form('vacForm',field('Any',input('vYear','number',year,'min="2026" max="2100"'))+field('Ronda',select('vRound',['1','2']))+field('Bomber',personSelect('vPerson'))+field('Quinzena',select('vPeriod',['1a gener','2a gener','1a febrer','2a febrer','1a març','2a març','1a abril','2a abril','1a maig','2a maig','1a juny','2a juny','1a juliol','2a juliol','1a agost','2a agost','1a setembre','2a setembre','1a octubre','2a octubre','1a novembre','2a novembre','1a desembre','2a desembre'])),'Registrar / actualitzar elecció')}
function permissions(){return panel('Dies personals i permisos',`<p class="muted">Peticions visibles dins d’aquesta còpia de l'app. «Confirmat» no equival a autorització oficial.</p>`)+form('permForm',field('Bomber',personSelect('pPerson'))+field('Data',input('pDate','date',today()))+field('Tipus',select('pType',['P0','Compensació d’hores','Addicional de vacances']))+field('Estat',select('pStatus',['M’interessa','Sol·licitat','Confirmat']))+field('Observacions','<input id="pNote">'))+panel('Calendari de peticions',table(['Data','Bomber','Tipus','Estat',''],[...state.permissions].sort((a,b)=>a.date.localeCompare(b.date)).map(x=>tr([x.date,x.person,x.type,`<span class="tag">${x.status}</span>`,del('permissions',x.id)]))))}
function dataPage(){return panel('Còpies de seguretat',`<div class="notice">Les dades es desen al servidor. Exporta còpies JSON regularment i conserva còpies del servidor PostgreSQL.</div><div class="row"><button id="export">Descarregar còpia JSON</button><label class="secondary" style="cursor:pointer">Importar còpia JSON <input id="import" type="file" accept=".json,application/json"></label></div><p class="muted">Importar substitueix totes les dades actuals després de confirmació.</p><button id="reset" class="danger">Restablir totes les dades</button>`)}
function bind(){document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{section=b.dataset.section;render()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(!confirm('Vols eliminar aquest registre?'))return;let key=b.dataset.delete,id=b.dataset.id;state[key]=state[key].filter(x=>x.id!==id);if(key==='community')state.communityPayments=state.communityPayments.filter(x=>x.feeId!==id);if(key==='events')state.attendance=state.attendance.filter(x=>x.eventId!==id);save()});document.querySelectorAll('[data-toggle]').forEach(x=>x.onchange=()=>{let item=state[x.dataset.toggle].find(i=>i.id===x.dataset.id);item.done=x.checked;save()});document.querySelectorAll('[data-taskstatus]').forEach(x=>x.onchange=()=>{state.tasks.find(i=>i.id===x.dataset.taskstatus).status=x.value;save()});document.querySelectorAll('[data-attend]').forEach(x=>x.onchange=()=>{state.attendance=state.attendance.filter(a=>!(a.eventId===x.dataset.attend&&a.person===x.dataset.person));if(x.checked)state.attendance.push({id:uid(),eventId:x.dataset.attend,person:x.dataset.person});save()});document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{let fee=state.community.find(x=>x.id===b.dataset.pay);if(state.communityPayments.some(x=>x.feeId===fee.id&&x.person===b.dataset.person&&x.kind==='cobrament'))return;add('communityPayments',{feeId:fee.id,kind:'cobrament',person:b.dataset.person,amount:fee.amount,date:today()})});document.querySelectorAll('[data-send]').forEach(b=>b.onclick=()=>{let id=b.dataset.send,amount=Number(read('send-'+id));if(!(amount>0))return alert('Import incorrecte');add('communityPayments',{feeId:id,kind:'pagament',amount,date:read('senddate-'+id)})});if($('#roleView'))$('#roleView').onchange=e=>{viewPerson=e.target.value;render()};if($('#vacYear'))$('#vacYear').onchange=e=>{year=Number(e.target.value);render()};const handlers={roleForm:()=>{let date=read('rDate'),person=read('rPerson'),role=read('rRole');if(state.roles.some(x=>x.date===date&&(x.person===person||x.role===role)))return alert('Ja existeix una assignació per a aquest bomber o aquest rol en aquesta data.');add('roles',{date,person,role})},specialForm:()=>add('special',{date:read('sDate'),person:read('sPerson'),type:read('sType'),place:read('sPlace')}),hoursForm:()=>add('overtime',{date:read('hDate'),person:read('hPerson'),hours:Number(read('hHours')),mode:read('hMode'),day:read('hDay')}),initialForm:()=>{state.cashInitial=Number(read('cInitial'));save()},cashForm:()=>add('cash',{date:read('cDate'),kind:read('cKind'),amount:Number(read('cAmount')),concept:read('cConcept'),channel:'efectiu'}),feeForm:()=>add('community',{title:read('fTitle'),type:read('fType'),amount:Number(read('fAmount'))}),shopForm:()=>add('shopping',{name:read('shName'),note:read('shNote'),done:false}),eventForm:()=>add('events',{title:read('eTitle'),date:read('eDate'),place:read('ePlace'),cost:Number(read('eCost'))||0}),taskForm:()=>add('tasks',{title:read('tTitle'),person:read('tPerson'),date:read('tDate'),priority:read('tPriority'),status:'Pendent'}),vacForm:()=>{let year=Number(read('vYear')),round=Number(read('vRound')),person=read('vPerson'),period=read('vPeriod');state.vacations=state.vacations.filter(v=>!(v.year===year&&v.round===round&&v.person===person));add('vacations',{year,round,person,period})},permForm:()=>add('permissions',{person:read('pPerson'),date:read('pDate'),type:read('pType'),status:read('pStatus'),note:read('pNote')})};for(let id in handlers){let f=$('#'+id);if(f)f.onsubmit=e=>{e.preventDefault();handlers[id]()}}if($('#export'))$('#export').onclick=()=>{let blob=new Blob([JSON.stringify({app:'tornA',version:1,data:state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='torn-a-copia-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};if($('#import'))$('#import').onchange=async e=>{try{let parsed=JSON.parse(await e.target.files[0].text());if(parsed.app!=='tornA'||!parsed.data||!Array.isArray(parsed.data.roles))throw Error('Format no reconegut');if(confirm('Substituir totes les dades actuals per aquesta còpia?')){state=parsed.data;save()}}catch(err){alert('No es pot importar: '+err.message)}};if($('#reset'))$('#reset').onclick=()=>{if(confirm('Eliminar TOTES les dades locals? Aquesta acció no es pot desfer sense una còpia de seguretat.')){state=initial();save()}} }
async function loadState(){
  const response=await fetch('/api/state');
  if(response.status===401){showLogin();return;}
  if(!response.ok)throw Error('No es pot llegir la base de dades');
  const payload=await response.json();
  revision=payload.revision;
  state={...initial(),...payload.data};
  render();
}
function showLogin(){
  document.querySelector('#nav').innerHTML='';
  document.querySelector('#app').innerHTML=`<section class="panel"><h2>Accés al Torn A</h2><p>Introdueix la contrasenya compartida.</p><form id="login"><label>Contrasenya</label><input id="password" type="password" autocomplete="current-password" required><p><button>Entrar</button></p></form><p id="loginError" class="error"></p></section>`;
  document.querySelector('#login').onsubmit=async e=>{
    e.preventDefault();
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('#password').value})});
    if(r.ok)await loadState();else document.querySelector('#loginError').textContent='Contrasenya incorrecta.';
  };
}
loadState().catch(e=>{document.querySelector('#app').textContent='Error connectant amb el servidor: '+e.message});
</script></body></html>
